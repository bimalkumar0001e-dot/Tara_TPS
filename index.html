      body {
        font-family: 'Outfit', sans-serif;
        background: #020617;
        overflow: hidden;
        color: #fff;
      }
      .font-varela {
        font-family: 'Varela Round', sans-serif;
      }
      
      @keyframes blink-cycle {
        0%, 100% { transform: scaleY(1); }
        40%, 60% { transform: scaleY(0.05); }
      }
      .blink-active {
        animation: blink-cycle 0.18s ease-in-out forwards;
      }

      /* Academic shimmer effect for UI */
      .academic-glow {
        text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
      }

      /* Spin animation for rotating rings */
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
